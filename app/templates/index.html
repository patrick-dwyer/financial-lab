<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mortgage Lab</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="dashboard">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Mortgage Lab</h2>
                <button onclick="addBlock('Lump Sum')">➕ Lump Sum</button>
                <button onclick="addBlock('Payment Change')">➕ Payment Change</button>
                <button onclick="addBlock('Rate Change')">➕ Rate Change</button>
                <button onclick="collectData()" class="calc-btn">🚀 Calculate</button>
            </div>

            <div id="block-container" class="block-stack">
                <div class="block base">
                    <div style="display: flex; justify-content: space-between;">
                        <strong>Base Mortgage</strong>
                    </div>
                    <div style="margin-top:10px;">
                        <label>Principal:</label>
                        <input type="number" class="base-principal" placeholder="$500,000" style="width:80px">
                    </div>
                    <div style="margin-top:10px;">
                        <label>Amortization Years:</label>
                        <input type="number" class="base-amortization" placeholder="30" style="width:80px">
                    </div>
                    <div style="margin-top:10px;">
                        <label>Interest Rate:</label>
                        <input type="number" class="base-interest" placeholder="5.00%" style="width:80px">
                    </div>
                    <div style="margin-top:10px;">
                        <label for="payment_schedule">Payment Schedule:</label>
                        <select name="payment_schedule" id="payment_schedule" class="base-payment" placeholder="Monthly" style="width:80px">
                            <option value="monthly">Monthly</option>
                            <option value="semi_monthly">Semi Monthly</option>
                            <option value="bi_weekly">Bi Weekly</option>
                            <option value="acc_bi_weekly">Accelerated Bi Weekly</option>
                            <option value="weekly">Weekly</option>
                            <option value="acc_weekly">Accelerated Weekly</option>
                        </select>
                    </div>
                </div>
                    
            </div>
        </aside>

        <main class="results-area">
                <div class="stats-row" id="base-stats">
                    <div class="stat-card">Base Payment Amount: <span id="base-frequency-payment-val">$0</span></div>
                </div>
            <div class="chart-wrapper">
                <canvas id="mortgageChart"></canvas>
                </div>
        </main>    
    </div>

    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
