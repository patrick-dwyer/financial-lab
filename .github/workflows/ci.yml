name: Mortgage Lab CI

# This tells GitHub when to run the tests automatically
on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    # 1. Grab your repository code
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Set up Python on the virtual machine
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'

    # 3. Install your project dependencies + pytest
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    # 4. Run your test suite
    - name: Run test suite
      env:
        SECRET_KEY: 'test-secret-key-for-ci-pipeline'
        FLASK_ENV: "development"
      run: |
        PYTHONPATH=. pytest -v